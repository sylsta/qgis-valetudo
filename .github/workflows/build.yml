name: Build plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m compileall -q valetudo_qgis scripts

      - name: Check translations
        run: python3 scripts/check_translations.py

      - name: Compile translations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qttools5-dev-tools
          scripts/compile_translations.sh

      - name: Package plugin
        run: |
          mkdir -p dist
          zip -r dist/valetudo_qgis.zip valetudo_qgis \
            -x '*__pycache__*' 'valetudo_qgis/i18n/*.ts'

      - uses: actions/upload-artifact@v4
        with:
          name: valetudo_qgis
          path: dist/valetudo_qgis.zip
